<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio Digital - Cut Nursilul</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#0f172a;
    color:white;
}


/* NAVBAR */

nav{
    position:fixed;
    top:0;
    width:100%;
    padding:20px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(15,23,42,.8);
    backdrop-filter:blur(10px);
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#38bdf8;
}


nav ul{
    display:flex;
    list-style:none;
}


nav ul li{
    margin-left:30px;
}


nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:500;
}


nav ul li a:hover{
    color:#38bdf8;
}


/* HERO */


.hero{

    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

    padding:100px 8% 50px;

    gap:60px;

}


.hero img{

    width:300px;
    height:300px;

    border-radius:50%;

    object-fit:cover;

    border:8px solid #38bdf8;

    box-shadow:0 0 40px #38bdf8;

}


.hero-text{

    max-width:600px;

}


.hero-text h1{

    font-size:60px;

}


.hero-text h2{

    color:#38bdf8;

    margin:15px 0;

}


.hero-text p{

    line-height:1.8;

    color:#cbd5e1;

}


.btn{

    display:inline-block;

    margin-top:30px;

    padding:15px 35px;

    background:#38bdf8;

    color:#0f172a;

    text-decoration:none;

    border-radius:30px;

    font-weight:bold;

}


.btn:hover{

    background:white;

}


/* SECTION */


section{

    padding:80px 8%;

}


.title{

    text-align:center;

    font-size:40px;

    margin-bottom:40px;

    color:#38bdf8;

}


.card{

    background:#1e293b;

    padding:30px;

    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.3);

}


/* ABOUT */


.about{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:30px;

}


.about p{

    line-height:1.8;

    color:#cbd5e1;

}

</style>

</head>

<body>


<nav>

<div class="logo">
Cut Nursilul
</div>


<ul>

<li><a href="#home">Home</a></li>

<li><a href="#about">Tentang</a></li>

<li><a href="#skill">Skill</a></li>

<li><a href="#contact">Kontak</a></li>

</ul>

</nav>


<section class="hero" id="home">


<img src="foto.jpg" alt="Foto Cut Nursilul">


<div class="hero-text">

<h1>Cut Nursilul</h1>

<h2>Web Designer & Digital Creator</h2>


<p>
Halo, saya Cut Nursilul. Saya memiliki minat dalam
teknologi, desain website, dan pengembangan digital.
Saya senang membuat tampilan website yang menarik,
modern, dan mudah digunakan.
</p>


<a href="#about" class="btn">
Lihat Profil
</a>


</div>


</section>
