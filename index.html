<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Digital - Cut Nursilul</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#6a11cb,#2575fc);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:360px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
    animation:fadeIn 1s ease;
}

.profile-img{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid #2575fc;
    object-fit:cover;
    margin-bottom:15px;
}

h1{
    color:#333;
    margin-bottom:5px;
}

.job{
    color:#2575fc;
    font-weight:bold;
    margin-bottom:15px;
}

.desc{
    color:#555;
    line-height:1.6;
    margin-bottom:20px;
}

button{
    background:#2575fc;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:30px;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    background:#6a11cb;
    transform:scale(1.05);
}

#message{
    margin-top:15px;
    color:green;
    font-weight:bold;
}

.social{
    margin-top:25px;
}

.social a{
    text-decoration:none;
    color:#2575fc;
    font-weight:bold;
    margin:0 10px;
    transition:.3s;
}

.social a:hover{
    color:#6a11cb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>
<body>

<div class="card">

    <img src="https://via.placeholder.com/170" alt="Foto Profil" class="profile-img">

    <h1>Cut Nursilul</h1>

    <p class="job">Digital Profile</p>

    <p class="desc">
        Halo! Saya <strong>Cut Nursilul</strong>. Saya memiliki minat dalam dunia
        teknologi, desain, dan pengembangan website. Saya senang belajar hal baru,
        mengembangkan keterampilan, serta membuat proyek yang bermanfaat.
    </p>

    <button onclick="showMessage()">Sapa Saya 👋</button>

    <div id="message"></div>

    <div class="social">
        <a href="#">Instagram</a> |
        <a href="#">Facebook</a> |
        <a href="#">GitHub</a>
    </div>

</div>

<script>
function showMessage(){
    document.getElementById("message").innerHTML =
    "😊 Halo! Terima kasih telah mengunjungi profil digital Cut Nursilul.";
}
</script>

</body>
</html>
